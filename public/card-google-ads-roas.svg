  <text x="48" y="82" font-family="Inter, sans-serif" font-size="14" fill="#8A8272">11 months · Google Ads</text>
  <g>
    <rect x="48"  y="141.6" width="34" height="198.4" rx="3" fill="#B08968"/>
    <rect x="96"  y="167.1" width="34" height="172.9" rx="3" fill="#B08968"/>
    <rect x="144" y="138.4" width="34" height="201.6" rx="3" fill="#B08968"/>
    <rect x="192" y="156.3" width="34" height="183.7" rx="3" fill="#B08968"/>
    <rect x="240" y="197.4" width="34" height="142.6" rx="3" fill="#D6C3AC"/>
    <rect x="288" y="156.3" width="34" height="183.7" rx="3" fill="#B08968"/>
