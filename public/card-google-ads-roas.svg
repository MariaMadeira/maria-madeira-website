  <line x1="40" y1="196" x2="566" y2="196" stroke="#3D3A33" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="636" y="192" font-family="Inter, sans-serif" font-size="13" fill="#3D3A33" text-anchor="end">Break-even</text>
  <text x="636" y="208" font-family="Inter, sans-serif" font-size="13" fill="#3D3A33" text-anchor="end">400%</text>
  <text x="48" y="374" font-family="Inter, sans-serif" font-size="13" fill="#8A8272">Oct 2025</text>
