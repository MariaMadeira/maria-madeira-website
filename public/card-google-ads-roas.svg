<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">Monthly ROAS over eleven months against a 400 percent break-even</title>
  <desc id="d1">Bar chart of monthly return on ad spend from October 2025 to August 2026, ranging from 396 to 668 percent, with a dashed break-even reference line at 400 percent.</desc>
